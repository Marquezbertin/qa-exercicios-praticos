<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Connect - Gestão de Clientes</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI',Arial,sans-serif; background:#eef2ff; color:#1e1b4b; }
  header { background:#4338ca; color:white; padding:16px 28px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:1.2rem; }
  main { max-width:1000px; margin:0 auto; padding:22px; }
  .painel { background:white; border-radius:12px; padding:18px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:20px; }
  .painel h2 { font-size:1rem; color:#4338ca; margin-bottom:14px; }
  .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; align-items:end; }
  .campo label { display:block; font-size:.8rem; font-weight:700; color:#6b7280; margin-bottom:4px; }
  .campo input, .campo select, .campo textarea { width:100%; padding:9px; border:1px solid #c7d2fe; border-radius:8px; font-size:.9rem; }
  .btn { padding:10px 16px; border:none; border-radius:8px; font-weight:700; cursor:pointer; font-size:.9rem; }
  .btn-ind { background:#4338ca; color:white; }
  .btn-edit { background:#0891b2; color:white; padding:5px 10px; font-size:.75rem; }
  .btn-del { background:#dc2626; color:white; padding:5px 10px; font-size:.75rem; margin-left:4px; }
  .btn-del:disabled { background:#fca5a5; }
  .msg { font-size:.82rem; margin-top:10px; min-height:14px; }
  .ok { color:#059669; }
  .err { color:#dc2626; }
  .busca { display:flex; gap:10px; margin-bottom:14px; }
  .busca input { flex:1; padding:10px; border:1px solid #c7d2fe; border-radius:8px; }
  table { width:100%; border-collapse:collapse; font-size:.88rem; }
  th { text-align:left; color:#6366f1; font-size:.75rem; text-transform:uppercase; padding:8px; border-bottom:2px solid #e0e7ff; }
  td { padding:9px 8px; border-bottom:1px solid #eef2ff; }
  .categoria { display:inline-block; padding:3px 8px; border-radius:10px; font-size:.72rem; font-weight:700; }
  .cat-VIP { background:#fef3c7; color:#92400e; }
  .cat-Normal { background:#e0e7ff; color:#3730a3; }
  .cat-Potencial { background:#dcfce7; color:#166534; }
  .vazio { color:#94a3b8; text-align:center; padding:30px; font-size:.9rem; }
  footer { text-align:center; padding:20px; color:#a5b4fc; font-size:.78rem; }
</style>
</head>
<body>

<header>
  <h1>CRM Connect - Gestão de Clientes</h1>
  <span style="font-size:.8rem; opacity:.8">Total: <span id="totalClientes">0</span> clientes</span>
</header>

<main>
  <div class="painel" id="painelForm">
    <h2 id="tituloForm">➕ Novo Cliente</h2>
    <div class="form-grid">
      <div class="campo">
        <label for="fNome">Nome completo</label>
        <input type="text" id="fNome" placeholder="Ex: João Pereira">
      </div>
      <div class="campo">
        <label for="fEmail">E-mail</label>
        <input type="text" id="fEmail" placeholder="cliente@empresa.com">
      </div>
      <div class="campo">
        <label for="fFone">Telefone</label>
        <input type="text" id="fFone" placeholder="(11) 98765-4321">
      </div>
      <div class="campo">
        <label for="fCat">Categoria</label>
        <select id="fCat">
          <option value="VIP">VIP</option>
          <option value="Normal" selected>Normal</option>
          <option value="Potencial">Potencial</option>
        </select>
      </div>
      <div class="campo">
        <label for="fObs">Observação</label>
        <textarea id="fObs" rows="1" placeholder="Detalhes do cliente"></textarea>
      </div>
      <div class="campo" style="display:flex; gap:8px;">
        <button class="btn btn-ind" id="btnSalvar" onclick="salvar()">Salvar</button>
        <button class="btn" id="btnNovo" style="background:#e0e7ff;color:#3730a3; display:none" onclick="novoCadastro()">+ Novo</button>
      </div>
    </div>
    <div class="msg" id="msgForm"></div>
  </div>

  <div class="painel">
    <h2>Clientes cadastrados</h2>
    <div class="busca">
      <input type="text" id="busca" placeholder="Buscar por nome, e-mail ou telefone...">
    </div>
    <table>
      <thead>
        <tr><th>Nome</th><th>E-mail</th><th>Telefone</th><th>Categoria</th><th>Ações</th></tr>
      </thead>
      <tbody id="corpoTabela"></tbody>
    </table>
    <div class="vazio" id="vazio" style="display:none">Nenhum cliente encontrado.</div>
  </div>
</main>

<footer>CRM Connect - Sistema fictício para testes de QA - Bugs intencionais</footer>

<script>
// Dados iniciais
var clientes = [
  { id: 1, nome: "Ana Souza", email: "ana@souza.com", fone: "(11) 99811-2233", cat: "VIP", obs: "Prefere contato por e-mail" },
  { id: 2, nome: "Bruno Lima", email: "bruno@lima.com", fone: "(21) 97654-8899", cat: "Normal", obs: "" },
  { id: 3, nome: "Carla Mendes", email: "carla@mendes.com", fone: "(31) 99123-4567", cat: "Potencial", obs: "Indicada por Ana" }
];

var proximoId = 4;
var editandoId = null;

function render() {
  var termo = document.getElementById("busca").value;
  var corpo = document.getElementById("corpoTabela");
  corpo.innerHTML = "";

  // Filtro de busca
  var filtrados = clientes.filter(function(c) {
    var t = termo.toLowerCase();
    var hay = (c.nome + " " + c.email + " " + c.fone).toLowerCase();
    return hay.includes(t);
  });

  document.getElementById("totalClientes").textContent = clientes.length;
  document.getElementById("vazio").style.display = filtrados.length === 0 ? "block" : "none";

  filtrados.forEach(function(c) {
    var tr = document.createElement("tr");
    tr.innerHTML =
      "<td>" + c.nome + "</td>" +
      "<td>" + c.email + "</td>" +
      "<td>" + c.fone + "</td>" +
      "<td><span class='categoria cat-" + c.cat + "'>" + c.cat + "</span></td>" +
      "<td>" +
        "<button class='btn btn-edit' onclick='editar(" + c.id + ")'>Editar</button>" +
        "<button class='btn btn-del' onclick='excluir(" + c.id + ")'>Excluir</button>" +
      "</td>";
    corpo.appendChild(tr);
  });
}

function validarCadastro() {
  var nome = document.getElementById("fNome").value.trim();
  var email = document.getElementById("fEmail").value.trim();
  var fone = document.getElementById("fFone").value.trim();

  var erros = [];

  if (nome.length < 3) erros.push("Nome deve ter pelo menos 3 caracteres.");

  if (email !== "" && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
    erros.push("E-mail inválido.");
  }

  if (fone === "") {
    erros.push("Telefone é obrigatório.");
  } else if (!/^\(\d{2}\)\s?\d{4,5}-\d{4}$/.test(fone)) {
    erros.push("Telefone deve seguir o formato (11) 98765-4321.");
  }

  return erros;
}

function salvar() {
  var msg = document.getElementById("msgForm");

  // Verifica duplicidade de e-mail (exceto o próprio em edição)
  var email = document.getElementById("fEmail").value.trim();
  var duplicado = clientes.some(function(c) {
    return c.email.toLowerCase() === email.toLowerCase() && c.id !== editandoId;
  });

  if (duplicado && email !== "") {
    msg.textContent = "Já existe um cliente com este e-mail.";
    msg.className = "msg err";
    return;
  }

  var erros = validarCadastro();
  if (erros.length) {
    msg.innerHTML = erros.join("<br>");
    msg.className = "msg err";
    return;
  }

  var dados = {
    nome: document.getElementById("fNome").value.trim(),
    email: email,
    fone: document.getElementById("fFone").value.trim(),
    cat: document.getElementById("fCat").value,
    obs: document.getElementById("fObs").value.trim()
  };

  if (editandoId === null) {
    clientes.push(Object.assign({ id: proximoId++ }, dados));
    msg.textContent = "Cliente cadastrado com sucesso!";
  } else {
    var idx = clientes.findIndex(function(c) { return c.id === editandoId; });
    if (idx >= 0) {
      clientes[idx] = Object.assign({}, clientes[idx], dados);
    }
    msg.textContent = "Cliente atualizado com sucesso!";
    editandoId = null;
    document.getElementById("tituloForm").textContent = "➕ Novo Cliente";
    document.getElementById("btnNovo").style.display = "none";
    document.getElementById("btnSalvar").textContent = "Salvar";
  }
  msg.className = "msg ok";
  limparForm();
  render();
}

function limparForm() {
  document.getElementById("fNome").value = "";
  document.getElementById("fEmail").value = "";
  document.getElementById("fFone").value = "";
  document.getElementById("fObs").value = "";
  document.getElementById("fCat").value = "Normal";
}

function novoCadastro() {
  editandoId = null;
  limparForm();
  document.getElementById("msgForm").textContent = "";
  document.getElementById("tituloForm").textContent = "➕ Novo Cliente";
  document.getElementById("btnNovo").style.display = "none";
  document.getElementById("btnSalvar").textContent = "Salvar";
}

function editar(id) {
  var c = clientes.find(function(x) { return x.id === id; });
  if (!c) return;
  editandoId = id;
  document.getElementById("fNome").value = c.nome;
  document.getElementById("fEmail").value = c.email;
  document.getElementById("fFone").value = c.fone;
  document.getElementById("fCat").value = c.cat;
  document.getElementById("fObs").value = c.obs;
  document.getElementById("msgForm").textContent = "";
  document.getElementById("tituloForm").textContent = "✏️ Editando cliente #" + id;
  document.getElementById("btnNovo").style.display = "inline-block";
  document.getElementById("btnSalvar").textContent = "Atualizar";
}

function excluir(id) {
  // EXCLUIR SEM CONFIRMAÇÃO é intencional? Não -- deveria pedir confirmação.
  var nome = (clientes.find(function(c) { return c.id === id; }) || {}).nome;
  var confirmou = confirm("Tem certeza que deseja excluir o cliente '" + nome + "'?");
  if (!confirmou) return;

  // Descobrir se o cliente tem pedidos
  var idx = clientes.findIndex(function(c) { return c.id === id; });
  if (idx >= 0) {
    clientes.splice(idx, 1);
    alert("Cliente excluído.");
  }
  render();
}

document.getElementById("busca").addEventListener("input", render);

render();
</script>
</body>
</html>
