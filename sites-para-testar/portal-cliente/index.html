<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Cliente - Cadastro e Login</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI',Arial,sans-serif; background:#f4f6fb; color:#1e293b; }
  header { background:#0f766e; color:white; padding:16px 28px; display:flex; align-items:center; gap:12px; }
  header h1 { font-size:1.2rem; }
  .abas { display:flex; gap:0; margin:24px auto 0; max-width:440px; }
  .aba { flex:1; padding:12px; text-align:center; cursor:pointer; background:#e2e8f0; font-weight:700; font-size:.9rem; border:none; }
  .aba.ativa { background:white; color:#0f766e; }
  .card { background:white; border-radius:0 0 12px 12px; padding:26px; max-width:440px; margin:0 auto 40px; box-shadow:0 2px 10px rgba(0,0,0,.06); border-radius:12px; }
  .card h2 { color:#0f766e; margin-bottom:18px; font-size:1.1rem; }
  .grupo { margin-bottom:14px; }
  .grupo label { display:block; font-size:.82rem; font-weight:700; color:#475569; margin-bottom:5px; }
  .grupo input { width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px; font-size:.95rem; }
  .grupo .dica { font-size:.72rem; color:#94a3b8; margin-top:3px; }
  .btn { width:100%; padding:12px; border:none; border-radius:8px; font-weight:700; font-size:.95rem; cursor:pointer; margin-top:8px; }
  .btn-primario { background:#0f766e; color:white; }
  .btn-primario:hover { background:#115e59; }
  .msg { font-size:.82rem; margin-top:10px; min-height:16px; line-height:1.4; }
  .ok { color:#059669; }
  .err { color:#dc2626; }
  .sucesso-box { background:#ecfdf5; border:1px solid #a7f3d0; border-radius:10px; padding:16px; margin-top:14px; text-align:center; }
  footer { text-align:center; padding:20px; color:#94a3b8; font-size:.78rem; }
</style>
</head>
<body>

<header>
  <h1>Portal Cliente - Central de Acesso</h1>
</header>

<div class="abas">
  <button class="aba ativa" id="abaCadastro" onclick="mudarAba('cadastro')">Cadastro</button>
  <button class="aba" id="abaLogin" onclick="mudarAba('login')">Login</button>
</div>

<!-- Cadastro -->
<div class="card" id="cardCadastro">
  <h2>Criar conta</h2>
  <div class="grupo">
    <label for="cNome">Nome completo</label>
    <input type="text" id="cNome" placeholder="Ex: Maria da Silva">
  </div>
  <div class="grupo">
    <label for="cCpf">CPF</label>
    <input type="text" id="cCpf" placeholder="000.000.000-00">
    <div class="dica">Use o formato 000.000.000-00 (dígitos verificadores validados)</div>
  </div>
  <div class="grupo">
    <label for="cEmail">E-mail</label>
    <input type="text" id="cEmail" placeholder="voce@email.com">
  </div>
  <div class="grupo">
    <label for="cSenha">Senha</label>
    <input type="password" id="cSenha" placeholder="Mínimo 6 caracteres">
    <div class="dica">Mínimo 6 caracteres, com letra e número</div>
  </div>
  <div class="grupo">
    <label for="cSenha2">Confirmar senha</label>
    <input type="password" id="cSenha2" placeholder="Repita a senha">
  </div>
  <div class="msg" id="msgCadastro"></div>
  <button class="btn btn-primario" onclick="cadastrar()">Criar conta</button>
</div>

<!-- Login -->
<div class="card" id="cardLogin" style="display:none">
  <h2>Entrar na conta</h2>
  <div class="grupo">
    <label for="lEmail">E-mail</label>
    <input type="text" id="lEmail" placeholder="voce@email.com">
  </div>
  <div class="grupo">
    <label for="lSenha">Senha</label>
    <input type="password" id="lSenha" placeholder="Sua senha">
  </div>
  <div class="msg" id="msgLogin"></div>
  <button class="btn btn-primario" onclick="logar()">Entrar</button>
</div>

<footer>Portal Cliente - Sistema fictício para testes de QA - Bugs intencionais</footer>

<script>
var usuarios = [];
var logado = false;

function mudarAba(nome) {
  var cad = nome === "cadastro";
  document.getElementById("cardCadastro").style.display = cad ? "block" : "none";
  document.getElementById("cardLogin").style.display = cad ? "none" : "block";
  document.getElementById("abaCadastro").classList.toggle("ativa", cad);
  document.getElementById("abaLogin").classList.toggle("ativa", !cad);
  document.getElementById("msgCadastro").textContent = "";
  document.getElementById("msgLogin").textContent = "";
}

function validarCpf(cpf) {
  // Validação simplificada: apenas confere 11 dígitos (NÃO confere dígitos verificadores)
  var dig = cpf.replace(/\D/g, "");
  return dig.length === 11;
}

function validarCpfCompleto(cpf) {
  // Validação completa com dígitos verificadores
  var dig = cpf.replace(/\D/g, "");
  if (dig.length !== 11) return false;
  if (/^(\d)\1{10}$/.test(dig)) return false;

  function calc(num) {
    var soma = 0;
    for (var i = 0; i < num.length; i++) {
      soma += parseInt(num[i], 10) * (num.length + 1 - i);
    }
    var resto = (soma * 10) % 11;
    return resto === 10 ? 0 : resto;
  }
  var dv1 = calc(dig.slice(0, 9));
  var dv2 = calc(dig.slice(0, 10));
  return dv1 === parseInt(dig[9], 10) && dv2 === parseInt(dig[10], 10);
}

function validarEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function cadastrar() {
  var nome = document.getElementById("cNome").value.trim();
  var cpf = document.getElementById("cCpf").value.trim();
  var email = document.getElementById("cEmail").value.trim();
  var senha = document.getElementById("cSenha").value;
  var senha2 = document.getElementById("cSenha2").value;
  var msg = document.getElementById("msgCadastro");

  var erros = [];

  if (nome.length < 3) erros.push("Nome deve ter pelo menos 3 caracteres.");

  if (!validarCpfCompleto(cpf)) {
    erros.push("CPF inválido (não passa na validação dos dígitos verificadores).");
  }

  if (!validarEmail(email)) erros.push("E-mail inválido.");

  if (senha.length < 6) {
    erros.push("Senha deve ter no mínimo 6 caracteres.");
  } else if (!/\d/.test(senha) || !/[a-zA-Z]/.test(senha)) {
    erros.push("Senha deve conter letra e número.");
  }

  if (senha2 !== senha) erros.push("As senhas não coincidem.");

  if (email !== "" && usuarios.some(function(u) { return u.email === email; })) {
    erros.push("Este e-mail já está cadastrado.");
  }

  if (erros.length) {
    msg.innerHTML = erros.join("<br>");
    msg.className = "msg err";
    return;
  }

  usuarios.push({ nome: nome, cpf: cpf, email: email, senha: senha });
  msg.innerHTML = '<div class="sucesso-box">Conta criada com sucesso! Faça o login na aba "Login".</div>';
  msg.className = "msg ok";

  document.getElementById("cNome").value = "";
  document.getElementById("cCpf").value = "";
  document.getElementById("cEmail").value = "";
  document.getElementById("cSenha").value = "";
  document.getElementById("cSenha2").value = "";
}

function logar() {
  var email = document.getElementById("lEmail").value.trim();
  var senha = document.getElementById("lSenha").value;
  var msg = document.getElementById("msgLogin");

  if (email === "" || senha === "") {
    msg.textContent = "Preencha e-mail e senha.";
    msg.className = "msg err";
    return;
  }

  var usuario = usuarios.find(function(u) { return u.email === email; });

  if (!usuario) {
    msg.textContent = "Usuário não encontrado. Verifique o e-mail ou crie uma conta.";
    msg.className = "msg err";
    return;
  }

  if (usuario.senha !== senha) {
    msg.textContent = "E-mail ou senha incorretos.";
    msg.className = "msg err";
    return;
  }

  logado = true;
  msg.innerHTML = '<div class="sucesso-box">✅ Bem-vindo(a), <strong>' + usuario.nome + '</strong>! Login efetuado com sucesso.</div>';
  msg.className = "msg ok";
}
</script>
</body>
</html>
